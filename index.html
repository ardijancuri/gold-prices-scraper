<!DOCTYPE html>
<html lang="sq">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Argjira - Tabela e Cmimeve</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root{--bg:#e9dfd1;--sand:#f5eee5;--panel:rgba(255,250,244,.84);--panel-strong:rgba(255,248,240,.94);--text:#1f1b17;--muted:#6f665d;--line:rgba(114,90,54,.18);--brand:#2f6666;--brand-deep:#173b3a;--gold:#bb9362;--buy:#1d7c62;--sell:#b44242;--shadow:0 24px 64px rgba(31,27,23,.16)}
    *{box-sizing:border-box}
    html,body{min-height:100%;background:var(--bg)}
    body{margin:0;font-family:"Manrope","Segoe UI",sans-serif;min-height:100vh;background:
      radial-gradient(circle at top left, rgba(255,255,255,.75) 0%, rgba(255,255,255,0) 36%),
      linear-gradient(135deg, rgba(47,102,102,.14) 0%, rgba(233,223,209,0) 34%),
      linear-gradient(180deg, #f7f0e7 0%, #eadfce 100%);
      color:var(--text)}
    body::before{content:"";position:fixed;inset:0;background:
      linear-gradient(180deg, rgba(245,238,229,.9) 0%, rgba(233,223,209,.96) 100%),
      url("argjira bg image.jpg") center/cover no-repeat;mix-blend-mode:multiply;opacity:.33;pointer-events:none}
    .wrap{position:relative;max-width:1240px;margin:0 auto;padding:12px 18px 36px}
    .top{margin-bottom:8px}
    .brand{display:flex;align-items:center;justify-content:center}
    .live-status{min-height:38px;line-height:1;margin:0;color:var(--brand);font-size:12px;background:rgba(255,255,255,.7);backdrop-filter:blur(16px);display:inline-flex;align-items:center;padding:0 14px;border:1px solid rgba(47,102,102,.14);border-radius:999px;box-shadow:0 10px 24px rgba(23,59,58,.08);font-weight:700;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
    .shell{display:block}
    .board{position:relative;z-index:1;background:linear-gradient(180deg, var(--panel) 0%, var(--panel-strong) 100%);border:1px solid rgba(255,250,244,.68);border-radius:32px;overflow:hidden;box-shadow:var(--shadow);backdrop-filter:blur(24px)}
    .board-head{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px;padding:16px 26px 18px;border-bottom:1px solid var(--line)}
    .board-title{display:flex;justify-content:flex-start}
    .board h2{margin:0;font-family:"Cormorant Garamond",Georgia,serif;font-size:42px;line-height:.95;font-weight:600;letter-spacing:-.03em;text-align:left}
    .board-status{display:flex;justify-content:flex-end}
    .table-wrap{padding:10px 26px}
    table{width:100%;border-collapse:separate;border-spacing:0 10px}
    thead th{padding:0 18px 4px;border:none;text-align:left;font-size:16px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
    thead th:nth-child(2), thead th:nth-child(3){text-align:left}
    tbody td{padding:10px 18px;text-align:left;background:rgba(255,255,255,.72);border-top:1px solid rgba(114,90,54,.12);border-bottom:1px solid rgba(114,90,54,.12);font-variant-numeric:tabular-nums;transition:transform .2s ease,background .2s ease,border-color .2s ease;font-size:clamp(1.6rem,2.8vw,2.5rem)}
    tbody td:first-child{border-left:1px solid rgba(114,90,54,.12);border-top-left-radius:18px;border-bottom-left-radius:18px;font-weight:700}
    tbody td:last-child{border-right:1px solid rgba(114,90,54,.12);border-top-right-radius:18px;border-bottom-right-radius:18px}
    tbody tr:hover td{background:#fffdf9;border-color:rgba(187,147,98,.32);transform:translateY(-1px)}
    tbody td:nth-child(2), tbody td:nth-child(3){text-align:left;font-weight:800}
    .asset{font-weight:800;color:var(--text);letter-spacing:.01em;font-size:clamp(1.6rem,2.7vw,2.4rem)}
    .num{font-variant-numeric:tabular-nums}
    .price-cell{display:inline-flex;align-items:center;justify-content:flex-start;gap:12px;min-width:180px}
    .price-val{display:inline-block;font-size:clamp(1.7rem,2.9vw,2.6rem);line-height:1.05;transition:color .2s ease}
    .price-cell.up .price-val{color:#168a55}
    .price-cell.down .price-val{color:#c03939}
    .price-cell.flat .price-val{color:#5f6672}
    .trend{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:999px;line-height:1;margin:0;vertical-align:middle;background:rgba(114,90,54,.08);border:1px solid rgba(114,90,54,.1);flex:0 0 40px}
    .trend svg{width:22px;height:22px;display:block;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;fill:none}
    .trend.up{color:#168a55;background:rgba(22,138,85,.12);border-color:rgba(22,138,85,.18)}
    .trend.down{color:#c03939;background:rgba(192,57,57,.12);border-color:rgba(192,57,57,.18)}
    .trend.flat{color:#7c8aa0;background:rgba(124,138,160,.12);border-color:rgba(124,138,160,.18)}
    @media (max-width:1080px){.board-head{grid-template-columns:auto 1fr auto}}
    @media (max-width:720px){.wrap{padding:8px 12px 24px}.board{border-radius:24px}.board-head{grid-template-columns:1fr;justify-items:center;padding:16px 18px 16px}.board-title,.board-status,.brand{justify-content:center}.board h2{font-size:34px;text-align:center}.table-wrap{padding:8px}thead th{font-size:13px;padding:0 14px 4px}tbody td{padding:10px 14px;font-size:1.3rem}.asset{font-size:1.3rem}.price-val{font-size:1.35rem}.price-cell{min-width:128px;gap:10px}.trend{width:34px;height:34px;flex-basis:34px}.trend svg{width:18px;height:18px}}
    @media (max-width:520px){.live-status{min-height:34px;padding:0 11px;font-size:11px}thead th{padding:0 12px 3px;font-size:11px}tbody td{padding:8px 12px;font-size:1.1rem}.asset{font-size:1.1rem}.price-val{font-size:1.15rem}.price-cell{min-width:100px;gap:8px}.trend{width:28px;height:28px;flex-basis:28px}.trend svg{width:15px;height:15px}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="top"></div>
    <div class="shell">
      <section class="board">
        <div class="board-head">
          <div class="board-title">
            <h2>Cmimet Aktuale</h2>
          </div>
          <div class="brand">
            <svg viewBox="0 0 104 11" fill="#2F6666" xmlns="http://www.w3.org/2000/svg" height="20px" aria-label="Argjira logo">

52V4.72269H85.9606ZM79.8234 0.678312H86.505C87.0365 0.678312 87.5162 0.739113 87.9413 0.859562C88.3746 0.982487 88.7503 1.16887 89.0673 1.41628C89.3879 1.6664 89.6291 1.9657 89.7886 2.31189C89.9459 2.65232 90.0247 3.03759 90.0247 3.46647C90.0247 3.82265 89.9631 4.157 89.8404 4.46781C89.7171 4.77896 89.5323 5.06462 89.2854 5.3233C89.0375 5.5833 88.7503 5.79407 88.4255 5.95469C88.2145 6.05911 87.9872 6.14302 87.7437 6.20631L90.3688 10.2882H87.799L85.224 6.31111H82.1752V10.2882H79.8234V0.678312Z"></path>
              <path d="M95.609 6.25606H98.7038L97.15 3.50985L95.609 6.25606ZM96.1943 0.678036H98.102L103.5 10.2879H100.971L99.5731 7.84426H94.7283L93.3662 10.2879H90.8566L96.1943 0.678036Z"></path>
            </svg>
          </div>
          <div class="board-status">
            <div id="liveStatus" class="live-status">Perditesuar --:--:--</div>
          </div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th></th><th id="buy1">Blerje</th><th id="sell1">Shitje</th></tr></thead>
            <tbody id="tbody1"></tbody>
          </table>
        </div>
      </section>
    </div>
  </div>

  <script>
    const labels = {
      sq: {
        title: 'Ekrani i Cmimeve',
        info: 'Vetem per informim',
        buy: 'Blerje',
        sell: 'Shitje',
        n: {
          goldKgUsd: 'ArKG/USD',
          goldKgEur: 'ArKG/EUR',
          goldOnsUsd: 'ArONS/USD',
          goldOnsEur: 'ArONS/EUR',
          silvKgEur: 'ArgjendKG/EUR'
        }
      }
    };

    const DISPLAY_ROWS = ['goldKgUsd','goldKgEur','goldOnsUsd','goldOnsEur','silvKgEur'];
    const ROW_DECIMALS = {};
    const SITE_API_URL = `${window.location.origin}/api/prices`;
    const LOCAL_API_URL = `${window.location.protocol}//${window.location.hostname || '127.0.0.1'}:3000/api/prices`;
    const API_URL = (() => {
      const host = window.location.hostname || '127.0.0.1';
      const isLocalPreview = (host === '127.0.0.1' || host === 'localhost') && window.location.port !== '3000';
      return isLocalPreview ? LOCAL_API_URL : SITE_API_URL;
    })();
    const PROVIDER_LABEL = {
      'nadirdoviz-html':'Nadir Live',
      'nadirdoviz-dom':'Nadir Live',
      'nadirdoviz-browser':'Nadir Live',
      'nadirdoviz-internal':'Nadir Live',
      'nadirdoviz-browserless':'Nadir Live',
      'goldapi-fallback':'Gold API Fallback'
    };

    let latest = null;
    let prevLatest = null;
    let currentLang = 'sq';
    let liveOk = false;
    let providerName = '';
    let lastUpdatedAt = null;
    let apiMeta = { stale:false, fetchedAt:null, lastSuccessAt:null };

    function fmt(value, decimals=2){
      const fixed = Number(value).toFixed(decimals);
      const parts = fixed.split('.');
      parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
      return parts.join('.');
    }

    function normalizeApiRow(row, key){
      const buy = Number(row?.buy);
      const sell = Number(row?.sell);
      if(!Number.isFinite(buy) || !Number.isFinite(sell)){
        throw new Error(`API row missing ${key}`);
      }
      return { buy, sell, mid:(buy + sell) / 2 };
    }

    function trendIcon(kind){
      if(kind === 'up'){
        return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 18V6"></path><path d="M7 11l5-5 5 5"></path></svg>';
      }
      if(kind === 'down'){
        return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v12"></path><path d="M17 13l-5 5-5-5"></path></svg>';
      }
      return '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"></path><path d="M15 8l4 4-4 4"></path></svg>';
    }

    function providerSuffix(){
      if(providerName === 'goldapi-fallback'){
        return '';
      }
      const label = PROVIDER_LABEL[providerName] ?? providerName;
      return label ? ` | ${label}` : '';
    }

    async function loadFromLocalApi(){
      const resp = await fetch(API_URL);
      if(!resp.ok){
        throw new Error(`Local API HTTP ${resp.status}`);
      }
      const data = await resp.json();
      const rows = {};
      for(const key of DISPLAY_ROWS){
        rows[key] = normalizeApiRow(data?.rows?.[key], key);
      }
      return {
        provider:data?.provider || 'nadirdoviz-dom',
        stale:Boolean(data?.stale),
        fetchedAt:data?.fetchedAt ? new Date(data.fetchedAt) : null,
        lastSuccessAt:data?.lastSuccessAt ? new Date(data.lastSuccessAt) : null,
        rows
      };
    }

    async function refreshData(){
      const result = await loadFromLocalApi();
      prevLatest = latest;
      latest = result.rows;
      providerName = result.provider;
      apiMeta = {
        stale:result.stale,
        fetchedAt:result.fetchedAt,
        lastSuccessAt:result.lastSuccessAt
      };
      lastUpdatedAt = result.fetchedAt ?? new Date();
      liveOk = !result.stale;
      render(currentLang);
    }

    function render(lang){
      currentLang = lang;
      const l = labels[lang];
      document.getElementById('buy1').textContent = l.buy;
      document.getElementById('sell1').textContent = l.sell;

      const renderRows = arr => arr.map(key => {
        const row = latest?.[key];
        const prev = prevLatest?.[key]?.mid;
        const base = row?.mid;
        const dec = ROW_DECIMALS[key] ?? 2;
        if(!Number.isFinite(base) || !Number.isFinite(row?.buy) || !Number.isFinite(row?.sell)){
          return `<tr><td class="asset">${l.n[key]}</td><td class="num">--</td><td class="num">--</td></tr>`;
        }
        let cls = 'flat';
        if(Number.isFinite(prev)){
          if(base > prev){ cls = 'up'; }
          else if(base < prev){ cls = 'down'; }
        }
        return `<tr><td class="asset">${l.n[key]}</td><td class="num"><span class="price-cell ${cls}"><span class="trend ${cls}">${trendIcon(cls)}</span><span class="price-val">${fmt(row.buy,dec)}</span></span></td><td class="num"><span class="price-cell ${cls}"><span class="trend ${cls}">${trendIcon(cls)}</span><span class="price-val">${fmt(row.sell,dec)}</span></span></td></tr>`;
      }).join('');

      document.getElementById('tbody1').innerHTML = renderRows(DISPLAY_ROWS);

      const st = document.getElementById('liveStatus');
      if(liveOk){
        const stamp = (apiMeta.fetchedAt ?? lastUpdatedAt ?? new Date()).toLocaleString('en-US', {
          month: '2-digit',
          day: '2-digit',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
          hour12: true
        });
        st.textContent = `Perditesuar ${stamp}${providerSuffix()}`;
        st.style.color = '#2F6666';
        st.style.background = 'rgba(255,255,255,.7)';
        st.style.borderColor = 'rgba(47,102,102,.14)';
      } else if(latest){
        const staleStamp = (apiMeta.lastSuccessAt ?? apiMeta.fetchedAt ?? lastUpdatedAt ?? new Date()).toLocaleString('en-US', {
          month: '2-digit',
          day: '2-digit',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit',
          second: '2-digit',
          hour12: true
        });
        st.textContent = `Vlerat e fundit nga API ${staleStamp}${providerSuffix()}`;
        st.style.color = '#8b6a32';
        st.style.background = 'rgba(255,249,236,.86)';
        st.style.borderColor = 'rgba(183,138,53,.18)';
      } else {
        st.textContent = 'Cmimet nga API nuk u ngarkuan';
        st.style.color = '#8b3a3a';
        st.style.background = 'rgba(255,244,244,.82)';
        st.style.borderColor = 'rgba(180,66,66,.18)';
      }

      document.documentElement.lang = lang;
    }

    refreshData().catch(() => {
      liveOk = false;
      apiMeta.stale = true;
      render(currentLang);
    });

    setInterval(() => {
      refreshData().catch(() => {
        liveOk = false;
        apiMeta.stale = true;
        render(currentLang);
      });
    }, 20000);

    render('sq');
  </script>
</body>
</html>
